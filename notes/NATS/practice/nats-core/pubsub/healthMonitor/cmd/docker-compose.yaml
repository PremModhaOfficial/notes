services:
  nats-1:
    image: nats:latest
    ports:
      - "4225:4222"
      - "8222:8222" # Monitor port
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222 --http_port 8222"

  nats-2:
    image: nats:latest
    ports:
      - "4223:4222"
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222 --routes nats://nats-1:6222"

  nats-3:
    image: nats:latest
    ports:
      - "4224:4222"
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222 --routes nats://nats-1:6222"
