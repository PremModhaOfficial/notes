# NATS Consumer Learning Lab - Docker Compose
# Self-contained environment for learning JetStream Consumers
#
# Usage:
#   docker compose up -d        # Start NATS server
#   docker compose logs -f      # View logs
#   docker compose down -v      # Stop and clean up
#
# NATS CLI access:
#   docker exec -it nats-consumer-lab nats stream ls
#   docker exec -it nats-consumer-lab nats consumer ls ORDERS

version: "3.8"

services:
  nats:
    image: nats:2.10-alpine
    container_name: nats-consumer-lab
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    command: >
      --name nats-consumer-lab
      --jetstream
      --store_dir /data
      --http_port 8222
      -m 8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  nats-data:
    driver: local

