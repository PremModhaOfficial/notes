# NATS Server Configuration for Node 1
# This is the primary node in a 3-node NATS cluster

# Server identification
server_name: "nats-1"

# Network configuration
host: "0.0.0.0"
port: 4222

# HTTP monitoring
http_port: 8222

# Logging configuration
log_file: "/logs/nats-1.log"
logtime: true
debug: false
trace: false

# Client connection limits
max_connections: 1000
max_control_line: 4096
max_payload: 1048576  # 1MB
max_pending: 67108864 # 64MB

# Ping settings to detect dead clients
ping_interval: "2m"
ping_max: 2

# Timeout settings
write_deadline: "10s"

# JetStream configuration
jetstream {
    # Enable JetStream
    enabled: true
    
    # Storage directory for streams and consumers
    store_dir: "/data/jetstream"
    
    # Memory and file storage limits
    max_memory_store: 1073741824  # 1GB memory storage
    max_file_store: 10737418240   # 10GB file storage
    
    # Domain configuration for multi-tenancy
    domain: "nats-cluster"
    
    # Enable clustering for JetStream
    # This allows streams to be replicated across nodes
    unique_tag: "node-1"
}

# Cluster configuration
cluster {
    # Cluster name - must be same across all nodes
    name: "nats-cluster"
    
    # This node's cluster listening address
    host: "0.0.0.0"
    port: 6222
    
    # Routes to other nodes in the cluster
    # These establish the mesh topology
    routes: [
        "nats://nats-2:6222"
        "nats://nats-3:6222"
    ]
    
    # Cluster authentication (optional but recommended for production)
    # authorization {
    #     user: "cluster_user"
    #     password: "cluster_password"
    #     timeout: 2
    # }
    
    # Cluster connection timeouts
    connect_retries: 10
    reconnect_delay: "5s"
}

# Account and user configuration
# For production, implement proper authentication
accounts {
    # System account for JetStream and monitoring
    $SYS {
        users = [
            { user: "admin", pass: "password" }
        ]
    }
    
    # Default account for client connections
    ACC {
        users = [
            { user: "client", pass: "password" }
        ]
        
        # JetStream limits for this account
        jetstream: {
            max_memory: 536870912    # 512MB
            max_file: 5368709120     # 5GB
            max_streams: 100
            max_consumers: 1000
        }
    }
}

# Set default account
system_account: "$SYS"

# TLS configuration (uncomment for production)
# tls {
#     cert_file: "/etc/nats/certs/server.crt"
#     key_file: "/etc/nats/certs/server.key"
#     ca_file: "/etc/nats/certs/ca.crt"
#     timeout: 3
# }

# Performance tuning
# These settings optimize for learning/development
max_msgs: 10000000
max_bytes: 10737418240  # 10GB
max_age: "168h"         # 1 week